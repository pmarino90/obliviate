[package]
name = "obliviate"
version = "0.2.0"
authors = ["Paolo Marino", "William Desportes"]
edition = "2021"
readme = "README.md"
license = "MIT"
# MSRV (required by clap)
rust-version = "1.74.0"
description = "Small utility to delete files older than a certain amount of days."
repository = "https://github.com/pmarino90/obliviate"
homepage = "https://github.com/pmarino90/obliviate"

[dependencies]
clap = {version = "4.5.1", features = ["cargo"]}
log = "0.4.6"
simple_logger = "5.0.0"
humansize = "2.1.3"
